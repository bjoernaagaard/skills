# Optional policy, not a universal definition of correct Python.
# Replace the example floor and pin tool versions in the project's lock workflow.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
